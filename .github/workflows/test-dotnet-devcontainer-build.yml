name: Test Dotnet Devcontainer Build

on:
  pull_request:
    branches: [main]
    paths: [.devcontainer/**]
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: dotnet --version
          push: never
